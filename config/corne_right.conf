# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
 CONFIG_ZMK_DISPLAY=y

# Set deep sleep to 30 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Make bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

&kscan0 {
	# Left -> Right
	# P1.11, P1.13, P1.15, P0.02, P0.29, P0.31 -> P1.11, P1.06, P1.15, P0.02, P0.10, P0.09
	# D14, D15, D18, D19, D20, D21 -> D14, D9, D18, D19, D16, D10
	col-gpios = <&pro_micro 14 GPIO_ACTIVE_HIGH>,
				<&pro_micro 9 GPIO_ACTIVE_HIGH>,
				<&pro_micro 18 GPIO_ACTIVE_HIGH>,
				<&pro_micro 19 GPIO_ACTIVE_HIGH>,
				<&pro_micro 16 GPIO_ACTIVE_HIGH>,
				<&pro_micro 10 GPIO_ACTIVE_HIGH>;
	# Top -> Bottom
	# P0.22, P0.24, P1.00, P0.11 -> P0.22, P1.04, P1.00, P0.11
	# D4, D5, D6, D7 -> D4, D8, D6, D7
	row-gpios = <&pro_micro 4 GPIO_ACTIVE_HIGH>,
				<&pro_micro 8 GPIO_ACTIVE_HIGH>,
				<&pro_micro 6 GPIO_ACTIVE_HIGH>,
				<&pro_micro 7 GPIO_ACTIVE_HIGH>;
};