# Change board name
CONFIG_ZMK_KEYBOARD_NAME="Corne"
# Enable USB drivers
CONFIG_USB=y
# Enable BT support
CONFIG_BT=y
# Enable USB ACM logging for debugging
CONFIG_ZMK_USB_LOGGING=y
# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
# Enable split keyboard support for passing indicator state to peripherals
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
# Enables a combination of settings that are planned to be default in future versions of ZMK to improve connection stability.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Enable support for displays
CONFIG_ZMK_DISPLAY=y
# If battery widget is enabled, show percentage instead of icons
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Set deep sleep to 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# Make bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10